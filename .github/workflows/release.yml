# Le release dell'app desktop: a ogni tag v* (o a mano) compila l'app per
# Windows e per macOS con il core, le librerie da cui dipende e i replayer
# di UADE, e lascia come artefatti l'installer di Windows e lo zip dell'app
# per Mac. scripts/publish-update.sh li scarica, li firma e prepara la
# cartella da caricare sul sito. Gira anche sui branch che toccano le app
# desktop o questo file, per provarli prima di una release (sui tag i
# percorsi non contano).
name: release

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'app/windows/**'
      - 'app/macos/**'
      - 'scripts/package-macos.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: version
        run: |
          line=$(grep '^version:' app/pubspec.yaml)
          version=${line#version: }
          echo "name=${version%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${version#*+}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "${version%+*}" ]]; then
            echo "il tag $GITHUB_REF_NAME non è la versione di app/pubspec.yaml (${version%+*})" >&2
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-libopenmpt
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-lame

      - name: Core
        shell: msys2 {0}
        run: |
          scripts/build-deps.sh
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target megaplayer_capi uade_data
          # La libreria del core, le DLL di MSYS2 da cui dipende, i replayer e
          # il SoundFont GeneralUser GS con la sua licenza.
          mkdir -p dist/core/soundfonts
          cp build/libmegaplayer.dll dist/core/
          ldd build/libmegaplayer.dll | awk '$3 ~ /^\/ucrt64\// { print $3 }' | sort -u | xargs -r cp -t dist/core/
          cp -r build/uade-data dist/core/
          cp third_party/src/generaluser-gs/GeneralUser-GS.sf2 dist/core/soundfonts/
          cp third_party/src/generaluser-gs/LICENSE.txt dist/core/soundfonts/GeneralUser-GS-LICENSE.txt
          ls dist/core

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: App
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define=MEGAPLAYER_VERSION=${{ needs.version.outputs.name }} `
            --dart-define=MEGAPLAYER_BUILD=${{ needs.version.outputs.build }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = 'build\windows\x64\runner\Release'
          Copy-Item -Recurse -Force ..\dist\core\* $release
          # Il runtime C++ di Visual Studio, che l'app usa e che non tutti i
          # Windows hanno: le DLL ridistribuibili accanto all'eseguibile.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" | Sort-Object FullName | Select-Object -Last 1
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item -Force (Join-Path $crt.FullName $dll) $release
          }
          Get-ChildItem $release -Filter *.dll | ForEach-Object Name

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc `
            /DAppVersion=${{ needs.version.outputs.name }} `
            /DAppBuild=${{ needs.version.outputs.build }} `
            "/DSourceDir=$pwd\app\build\windows\x64\runner\Release" `
            "/DOutputDir=$pwd\dist" `
            app\windows\installer\megaplayer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: megaplayer-windows-setup
          path: dist/megaplayer-*-windows-setup.exe
          if-no-files-found: error

  macos:
    needs: version
    # Le librerie di Homebrew sono compilate per questo macOS: l'app gira da
    # macOS 15 in poi, sui Mac con Apple Silicon.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze
        run: brew install ninja pkg-config libopenmpt libarchive lame

      - name: Core
        run: |
          scripts/build-deps.sh
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target megaplayer_capi uade_data

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: App
        working-directory: app
        run: |
          flutter build macos --release \
            --dart-define=MEGAPLAYER_VERSION=${{ needs.version.outputs.name }} \
            --dart-define=MEGAPLAYER_BUILD=${{ needs.version.outputs.build }}

      - name: Pacchetto
        run: |
          scripts/package-macos.sh app/build/macos/Build/Products/Release/megaplayer.app \
            dist/megaplayer-${{ needs.version.outputs.name }}-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: megaplayer-macos
          path: dist/megaplayer-*-macos.zip
          if-no-files-found: error
