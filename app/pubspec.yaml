name: megaplayer
description: "Player per formati audio esotici"
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.5

dependencies:
  cryptography: ^2.9.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Font della skin moderna (Sora, JetBrains Mono) e della retrò (Pixelify
  # Sans, Silkscreen, VT323), tutti con licenza OFL: vedi assets/fonts.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans-Variable.ttf
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
